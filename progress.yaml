# ---------------------------------------------------------------- visual servoing groups
# Detailed plans: docs/IBVS.md, docs/PBVS.md, docs/VISUAL_SERVOING_BENCHMARK.md.
# Acceptance values are preliminary engineering targets.
vs_groups:
- id: ibvs
  name: Group A — IBVS
  doc: docs/IBVS.md
  work_packages:
  - WP10
  objective: Bring the gripper to the pre-grasp pose by driving image features to their desired values.
  levels:
  - id: L1
    features: 4 ArUco corners
    target: Static marker
  - id: L2
    features: 4 ArUco corners
    target: Moving marker
  - id: L3
    features: Cap centre + area (normalised), orientation held
    target: Static upright bottle
  - id: L4
    features: + ellipse / bottle-axis tilt features
    target: Static bottle, various tilts
  - id: L5
    features: Selected markerless set
    target: Moving bottle
- id: pbvs
  name: Group B — Pose estimation and PBVS
  doc: docs/PBVS.md
  work_packages:
  - WP11
  - WP12
  objective: Estimate the 3D cap state from RGB and bring the gripper to the pre-grasp pose by driving the Cartesian pose error to zero.
  levels:
  - id: L1
    features: ArUco + PnP
    target: Static marker
  - id: L2
    features: ArUco + PnP
    target: Moving marker
  - id: L3
    features: Ellipse-based pose
    target: Static bottle
  - id: L4
    features: DL pose
    target: Static bottle
  - id: L5
    features: SfM (multi-view)
    target: Static bottle
  - id: L6
    features: Selected single-view RGB estimator
    target: Moving bottle
- id: hybrid
  name: Hybrid (joint, mandatory)
  doc: docs/VISUAL_SERVOING_BENCHMARK.md
  work_packages:
  - WP13
  objective: 2.5D visual servoing combining the IBVS and PBVS cores.
  levels: []

