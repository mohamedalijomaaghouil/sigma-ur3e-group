interfaces:
  - {name: /camera/color/image_raw, type: sensor_msgs/Image, from: ur3e_camera, to: [ur3e_perception, ur3e_ibvs]}
  - {name: /camera/color/camera_info, type: sensor_msgs/CameraInfo, from: ur3e_camera, to: [ur3e_perception, ur3e_ibvs, ur3e_pose_estimation]}
  - {name: /perception/detections, type: vision_msgs/Detection2DArray, from: ur3e_perception, to: [ur3e_ibvs, ur3e_pose_estimation]}
  - {name: /perception/cap_pose, type: geometry_msgs/PoseStamped, from: ur3e_pose_estimation, to: [ur3e_pbvs, ur3e_hybrid, ur3e_task_manager]}
  - {name: /ibvs/cmd_vel, type: geometry_msgs/TwistStamped, from: ur3e_ibvs, to: [ur3e_control]}
  - {name: /pbvs/cmd_vel, type: geometry_msgs/TwistStamped, from: ur3e_pbvs, to: [ur3e_control]}
  - {name: /hybrid/cmd_vel, type: geometry_msgs/TwistStamped, from: ur3e_hybrid, to: [ur3e_control]}
  - {name: /control/cmd_twist, type: geometry_msgs/TwistStamped, from: ur3e_control, to: [ur3e_control]}
  - {name: /forward_velocity_controller/commands, type: std_msgs/Float64MultiArray, from: ur3e_control, to: [ur_robot_driver]}
  - {name: gripper command, type: control_msgs/action/GripperCommand, from: ur3e_manipulation, to: [gripper driver]}

