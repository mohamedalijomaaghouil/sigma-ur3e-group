# Single source of truth for project progress.
# Read by the dashboard (web/). Edit by hand, commit with the work it describes.
#
# Rules
# - Never mark progress without evidence (a test, an experiment folder, a commit or a document).
# - Validation is tracked per level: implementation, offline, simulation, hardware.
#     implementation: not_started | in_progress | done
#     offline / simulation / hardware: not_started | in_progress | passed | failed | not_applicable
# - Work package status: planned | in_progress | in_review | blocked | done | deferred
# - Acceptance numbers are preliminary engineering targets until evidence supports them.

schema_version: 1
updated: 2026-11-26

# Only the progress maintainer edits this file (progress, next step, statuses, evidence).
# Other members propose changes to them instead of editing it.
maintainer: Mohamed Taher GUERBEJ

# The next concrete step, shown on the dashboard. Update it whenever the focus changes.
next_step:
  title: Start WP2 camera acquisition (software side)
  work_package: WP2
  detail: "Camera launch file, ur3e_camera package (stream_check, dataset_recorder) with unit tests. Hardware validation waits for the RealSense model and profiles (Q2)."

project:
  name: sigma-ur3e-group
  title: Vision-based assistive bottle opening with a UR3e
  short_title: UR3e Assistive Bottle Opening
  institution: SIGMA Clermont — Sensors and Robotic Applications (Project-3A)
  summary: >-
    A person who can use only one hand holds a water bottle. A UR3e with an RGB camera detects the
    bottle and its cap, approaches it with visual servoing (IBVS, PBVS and hybrid), grasps the cap,
    unscrews it, detects that it is free and lifts it about 3 cm.
  use_case_steps:
    - Detect the bottle and its cap
    - Estimate visual features and/or the 3D cap pose
    - Approach the cap
    - Follow bottle motion with visual servoing
    - Grasp the cap
    - Unscrew it
    - Detect cap release
    - Lift the cap about 3 cm
  development_levels:
    - id: L1
      name: Bottle in a fixture
      status: planned
    - id: L2
      name: Bottle moved by hand between and during trials
      status: planned
    - id: L3
      name: Person holds the bottle
      status: planned
      note: Only after validation, a risk assessment and approval from the professors
  hardware:
    - item: Universal Robots UR3e (6 DoF)
      status: confirmed
    - item: Intel RealSense camera, RGB only for perception
      status: model to confirm
    - item: OnRobot gripper
      status: model to confirm
    - item: UR3e built-in force/torque sensing
      status: ROS 2 access to verify
  software:
    ros_distro: humble
    ros_distro_note: Verified on the development laptop (Ubuntu 22.04); lab PCs to confirm
    stack: [ROS 2 Humble, ur_robot_driver, ros2_control, MoveIt 2, MoveIt Servo, OpenCV, PyTorch, NumPy, SciPy]
  demo:
    date: 2027-02-09
    status: to_confirm
    note: From the updated Project-3A brief of 06/10/2026; reconfirm with the professors
  repository:
    url: https://github.com/mohamedalijomaaghouil/sigma-ur3e-group
    working_branch: Taher
    main_branch: main

