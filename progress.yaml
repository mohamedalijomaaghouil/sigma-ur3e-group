# Planned comparisons per subsystem (methods only; results live in experiments/).
subsystems:
  - id: intrinsic_calibration
    name: Intrinsic camera calibration
    work_packages: [WP3]
    primary: ChArUco target + OpenCV calibrateCamera
    alternatives: [Chessboard target, Own Zhang solver (optional)]
    references: [ROS camera_calibration, RealSense factory intrinsics]
    validation: Held-out images and repeatability across sessions
    metrics: [RMS reprojection error on fit images (px), RMS on held-out images (px), Parameter spread across sessions (%)]
  - id: hand_eye
    name: Hand-eye calibration
    work_packages: [WP6]
    primary: OpenCV calibrateHandEye (method chosen from results)
    alternatives: [Tsai–Lenz, Park–Martin, Horaud, Andreff, Daniilidis]
    references: [easy_handeye2]
    validation: Independent robot poses
    metrics: [Translation consistency (mm), Rotation consistency (deg)]
  - id: kinematics
    name: Forward kinematics and Jacobian
    work_packages: [WP4, WP5]
    primary: Own FK and Jacobian from the calibrated UR3e kinematics
    alternatives: []
    references: [TF from robot_state_publisher, Finite differences]
    validation: Measured TCP motion
    metrics: [FK position error (mm), FK orientation error (deg), Jacobian relative error]
  - id: cartesian_control
    name: Cartesian velocity control
    work_packages: [WP5]
    primary: Own damped least-squares controller
    alternatives: []
    references: [MoveIt Servo]
    validation: Tracking error on mock hardware, URSim and the robot
    metrics: [Twist tracking error, Joint velocity saturation events, Stop time after timeout]
  - id: detection
    name: Object detection
    work_packages: [WP8]
    primary: Fine-tuned YOLO
    alternatives: [HSV + contours + ellipse fit]
    references: [COCO-pretrained YOLO]
    validation: ArUco ground truth and a labelled held-out session
    metrics: [Precision, Recall, Centre error (px), Latency (ms)]
  - id: pose_estimation
    name: Cap pose estimation
    work_packages: [WP11]
    primary: Chosen from results
    alternatives: [Ellipse geometry, DL keypoints + geometry, Structure from Motion]
    references: [ArUco PnP]
    validation: Ground truth (ArUco; depth only if allowed)
    metrics: [Position error (mm), Axis error (deg)]
  - id: visual_servoing
    name: Visual servoing
    work_packages: [WP10, WP12, WP13, WP16]
    primary: IBVS, PBVS and hybrid (all mandatory)
    alternatives: []
    references: [ViSP (optional)]
    validation: Same initial conditions and target motions for every controller
    metrics: [Convergence time (s), Final error, Trajectory smoothness, Robustness to target motion]
  - id: manipulation
    name: Grasp and unscrew
    work_packages: [WP7, WP15]
    primary: To be defined after feasibility measurements
    alternatives: [Continuous rotation, Release–regrasp cycles]
    references: []
    validation: Trials on a fixed bottle
    metrics: [Grasp success rate, Opening success rate, Execution time]

